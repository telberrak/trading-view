# Builds the desktop app for Mac (.dmg) and Windows (installer .exe).
# Runs on every version tag (v1.0.0, v1.1.0, …) and attaches both files to a GitHub release,
# or by hand from the Actions tab ("Run workflow"), where the files appear under the run's Artifacts.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (M1 and later)
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build front end
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Bundle backend (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm tv-backend.spec

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Package app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # not code-signed
        run: |
          npm install
          npx electron-builder --${{ matrix.name == 'mac' && 'mac' || 'win' }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: IBKR-Charts-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
