<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charts</title>
  </head>
  <body>
    <header id="toolbar">
      <div class="search sym-pill">
        <span class="ico" data-icon="search"></span>
        <input id="symbol" autocomplete="off" spellcheck="false" placeholder="Symbol" />
        <ul id="results" class="results" hidden></ul>
      </div>
      <div class="sep"></div>
      <div id="timeframes" class="group"></div>
      <div class="sep"></div>
      <div class="menu-wrap">
        <button id="ct-btn" class="tbtn icon-only" title="Chart type"></button>
        <div id="ct-menu" class="menu" hidden></div>
      </div>
      <div class="sep"></div>
      <div class="menu-wrap">
        <button id="ind-btn" class="tbtn"><span class="ico" data-icon="indicators"></span>Indicators</button>
        <div id="ind-menu" class="menu" hidden></div>
      </div>
      <button id="alert-btn" class="tbtn" title="Create alert (Alt+A)"><span class="ico" data-icon="alert"></span>Alert</button>
      <button id="replay-btn" class="tbtn" title="Bar replay"><span class="ico" data-icon="replay"></span>Replay</button>
      <div class="sep"></div>
      <button id="undo-btn" class="tbtn icon-only" title="Undo (Cmd/Ctrl+Z)"><span class="ico" data-icon="undo"></span></button>
      <button id="redo-btn" class="tbtn icon-only" title="Redo (Shift+Cmd/Ctrl+Z)"><span class="ico" data-icon="redo"></span></button>
      <div class="spacer"></div>
      <span id="conn" class="conn" title="IBKR connection"></span>
      <button id="shot-btn" class="tbtn icon-only" title="Save chart image"><span class="ico" data-icon="camera"></span></button>
      <button id="full-btn" class="tbtn icon-only" title="Full screen"><span class="ico" data-icon="full"></span></button>
    </header>
    <div id="body">
      <nav id="tools">
        <button data-tool="cross" class="active" title="Crosshair"><span class="ico" data-icon="cross"></span></button>
        <button data-tool="trend" title="Trend line"><span class="ico" data-icon="trend"></span></button>
        <button data-tool="ray" title="Ray"><span class="ico" data-icon="ray"></span></button>
        <button data-tool="hline" title="Horizontal line"><span class="ico" data-icon="hline"></span></button>
        <button data-tool="vline" title="Vertical line"><span class="ico" data-icon="vline"></span></button>
        <button data-tool="channel" title="Parallel channel (3 clicks)"><span class="ico" data-icon="channel"></span></button>
        <button data-tool="fib" title="Fib retracement"><span class="ico" data-icon="fib"></span></button>
        <button data-tool="rect" title="Rectangle"><span class="ico" data-icon="rect"></span></button>
        <button data-tool="text" title="Text"><span class="ico" data-icon="text"></span></button>
        <button data-tool="ruler" title="Measure (click start, click end)"><span class="ico" data-icon="ruler"></span></button>
        <div class="tsep"></div>
        <button id="draw-magnet" title="Magnet: snap to open/high/low/close"><span class="ico" data-icon="magnet"></span></button>
        <button id="draw-lock" title="Lock all drawings"><span class="ico" data-icon="lock"></span></button>
        <button id="draw-hide" title="Hide drawings"><span class="ico" data-icon="eye"></span></button>
        <button id="draw-clear" title="Remove drawings on this chart"><span class="ico" data-icon="trash"></span></button>
      </nav>
      <main id="center">
        <section id="chart-wrap">
          <div id="legend"></div>
          <div id="chart"></div>
          <div id="notice" hidden></div>
          <div id="replay-bar" hidden>
            <button id="rp-select" title="Pick a new start bar">Select bar</button>
            <button id="rp-play" title="Play / pause"></button>
            <button id="rp-step" title="Forward one bar (Shift+Right)"></button>
            <select id="rp-speed" title="Speed"><option value="3000">0.3x</option><option value="1000" selected>1x</option><option value="300">3x</option><option value="100">10x</option></select>
            <span id="rp-hint"></span>
            <button id="rp-exit" title="Back to real time">Exit replay</button>
          </div>
        </section>
        <footer id="rangebar">
          <div id="ranges" class="group"></div>
          <div class="spacer"></div>
          <span id="clock"></span>
        </footer>
      </main>
      <aside id="side">
        <section id="watchlist">
          <div class="wl-head">
            <select id="wl-select" title="Watchlists"></select>
            <div class="spacer"></div>
            <button id="wl-plus" class="ibtn" title="Add symbol"><span class="ico" data-icon="plus"></span></button>
            <div class="menu-wrap">
              <button id="wl-more" class="ibtn" title="List options"><span class="ico" data-icon="more"></span></button>
              <div id="wl-menu" class="menu right" hidden>
                <button data-act="section">Add section</button>
                <button data-act="new">New list</button>
                <button data-act="rename">Rename list</button>
                <button data-act="import">Import TWS watchlist…</button>
                <button data-act="delete" class="danger">Delete list</button>
              </div>
            </div>
            <input id="wl-file" type="file" accept=".csv,.txt" hidden />
          </div>
          <div class="search wl-search" hidden>
            <input id="wl-add" autocomplete="off" spellcheck="false" placeholder="Add symbol" />
            <ul id="wl-results" class="results" hidden></ul>
          </div>
          <div class="wl-cols"><span>Symbol</span><span class="n">Last</span><span class="n">Chg%</span><span class="n">Vol</span></div>
          <div id="wl-rows"></div>
        </section>
        <section id="details"></section>
        <section id="trading" class="hidden">
          <div class="wl-head"><b>Trading</b><span id="tr-acct" class="tr-acct"></span><div class="spacer"></div></div>
          <div id="trade-rows"></div>
        </section>
        <section id="alerts" class="hidden">
          <div class="wl-head"><b>Alerts</b><div class="spacer"></div>
            <button id="al-new" class="ibtn" title="Create alert"><span class="ico" data-icon="plus"></span></button></div>
          <div id="alert-rows"></div>
        </section>
      </aside>
      <nav id="rail">
        <button id="rail-wl" class="active" title="Watchlist"><span class="ico" data-icon="list"></span></button>
        <button id="rail-det" class="active" title="Symbol details"><span class="ico" data-icon="info"></span></button>
        <button id="rail-tr" title="Positions and orders"><span class="ico" data-icon="wallet"></span></button>
        <button id="rail-al" title="Alerts"><span class="ico" data-icon="alert"></span></button>
      </nav>
    </div>
    <div id="toasts"></div>
    <dialog id="alert-dlg">
      <form id="al-form">
        <h3>Create alert on <span id="al-sym"></span></h3>
        <label>Condition
          <select id="al-cond"><option value="crossing">Crossing</option><option value="above">Greater than</option><option value="below">Less than</option></select>
        </label>
        <label>Price <input id="al-price" type="number" step="any" required /></label>
        <label>Message <input id="al-msg" type="text" placeholder="Optional" maxlength="200" /></label>
        <div id="al-err" class="err"></div>
        <div class="dlg-btns"><button type="button" id="al-cancel">Cancel</button><button type="submit" class="primary">Create</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
